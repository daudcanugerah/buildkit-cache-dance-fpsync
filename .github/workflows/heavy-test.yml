---
name: Heavy pnpm install Test
on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'dist/**'
      - 'action.yml'
      - '.github/workflows/heavy-test.yml'
      - '.github/workflows/test-heavy/**'

env:
  PNPM_HOME: /pnpm
  STORE_PATH: /pnpm/store

jobs:
  heavy_pnpm_install:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3
        id: buildx
        with:
          driver: docker-container
          # Bigger GC budget for cache mounts: default auto-computed rule caps
          # stale (>48h) exec.cachemount blobs at ~488 MiB; give it 8 GiB and
          # raise the overall keep policy for the ~2.2GB pnpm store.
          config-inline: |
            [worker.oci]
              gc = true
              gckeepduration = "48h"
              gckeepdiskusage = "30GB"

            [[worker.oci.gcpolicy]]
              keepBytes = 8589934592
              keepDuration = 172800
              filters = ["type==exec.cachemount"]

            [[worker.oci.gcpolicy]]
              keepBytes = 21474836480
              all = true
              keepDuration = 172800

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: test-heavy

      - name: Cache pnpm store
        uses: actions/cache@v4
        id: cache
        with:
          path: |
            pnpm-store
          # Rolling key: a deterministic key (hash of package.json) causes an
          # exact-key hit on every run, and actions/cache then SKIPS saving in
          # the post step ("Cache hit occurred on the primary key, not saving
          # cache") - so the freshly extracted store would never be saved.
          # A unique per-run key always saves; restore-keys fetches the most
          # recent entry on the next run.
          key: cache-heavy-pnpm-${{ github.run_id }}
          restore-keys: |
            cache-heavy-pnpm-

      - name: inject cache into docker
        uses: ./
        with:
          skip-extraction: false
          builder: ${{ steps.buildx.outputs.name }}
          cache-map: |
            {
              "pnpm-store": {
                "target": "/pnpm/store",
                "id": "pnpm-store"
              }
            }

      - name: Heavy build (pnpm install with many big packages)
        uses: docker/build-push-action@v6
        with:
          context: .github/workflows/test-heavy
          #cache-from: type=gha
          #cache-to: type=gha,mode=max
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
